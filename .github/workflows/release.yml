name: release

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            asset: headwork-x86_64-pc-windows-msvc.exe
            binary: target/release/headwork.exe
          - os: macos-latest
            asset: headwork-aarch64-apple-darwin
            binary: target/release/headwork
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      HEADWORK_VERSION: 0.1.${{ github.run_number }}
      HEADWORK_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: Swatinem/rust-cache@v2
      - name: gate
        shell: bash
        run: bash scripts/check.sh
      - name: build
        shell: bash
        run: cargo build --release --locked -p headwork
      - name: check the binary
        shell: bash
        run: |
          "${{ matrix.binary }}" --version
          "${{ matrix.binary }}" --version | grep -F "headwork $HEADWORK_VERSION ($HEADWORK_COMMIT, schema "
      - name: stage
        shell: bash
        run: mkdir -p dist && cp "${{ matrix.binary }}" "dist/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: checksums
        working-directory: dist
        run: sha256sum headwork-* > SHA256SUMS && cat SHA256SUMS
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.1.${{ github.run_number }}
        run: |
          expected=$(ls dist | wc -l)
          repo="${{ github.repository }}"
          for attempt in 1 2 3; do
            if gh release view "$TAG" --repo "$repo" >/dev/null 2>&1; then
              gh release upload "$TAG" dist/* --repo "$repo" --clobber || true
            else
              gh release create "$TAG" dist/* \
                --repo "$repo" \
                --target "${{ github.sha }}" \
                --title "headwork $TAG" \
                --generate-notes || true
            fi
            have=$(gh release view "$TAG" --repo "$repo" --json assets --jq '.assets | length' 2>/dev/null \
              || echo 0)
            if [ "$have" -eq "$expected" ]; then
              exit 0
            fi
            sleep $((attempt * 15))
          done
          exit 1
      - name: migration notes
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.1.${{ github.run_number }}
        run: |
          previous=$(git tag --list 'v0.1.*' --sort=-v:refname | grep -vx "$TAG" | head -1 || true)
          bash scripts/release-migration-notes.sh "${{ github.sha }}" "$previous" > migration-notes.md
          if [[ -s migration-notes.md ]]; then
            gh release view "$TAG" --repo "${{ github.repository }}" --json body --jq .body > notes.md
            echo >> notes.md
            cat migration-notes.md >> notes.md
            gh release edit "$TAG" --repo "${{ github.repository }}" --notes-file notes.md
          fi
